name: Dependabot Auto-Merge

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Only patch and minor updates are merged automatically. Major updates -
      # and any PR whose update type could not be determined - stay open for
      # manual review. For grouped PRs, fetch-metadata reports the highest
      # semver change in the group, so a group containing a major is skipped too.
      - name: Wait for CI to complete
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-regexp: '(test|lint).*'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          allowed-conclusions: success

      # Retries because this job has no concurrency group: when Dependabot
      # opens several PRs at once, their merge steps run fully in parallel,
      # and gh pr merge fails outright ("Base branch was modified. Review
      # and try the merge again.") if another PR from the same batch merges
      # in between GitHub computing this PR's mergeability and the merge
      # call landing. A plain retry resolves it, since the PR itself has no
      # real conflict -- only main's tip moved.
      - name: Merge Dependabot PRs
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: |
          for attempt in 1 2 3 4 5; do
            if gh pr merge --squash "$PR_URL"; then
              exit 0
            fi
            echo "Merge attempt $attempt failed (likely a concurrent same-batch merge moved main); retrying..."
            sleep $((attempt * 5))
          done
          echo "::error::Failed to merge $PR_URL after 5 attempts"
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip major or unknown updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-minor' && steps.metadata.outputs.update-type != 'version-update:semver-patch'
        run: |
          echo "Update type: ${UPDATE_TYPE:-<undetermined>}"
          echo "Not auto-merged - this PR needs manual review."
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
